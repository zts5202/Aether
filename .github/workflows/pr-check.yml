name: PR Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            android:
              - 'app/**'
              - 'shared/**'
              - 'extensions/**'
              - 'pi-bridge/**'
              - 'packages/extension-api/**'
              - 'third_party/termux/**'
              - '.github/workflows/build-nightly-apk.yml'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/pr-check.yml'
            node:
              - 'extensions/**'
              - 'pi-bridge/**'
              - 'packages/extension-api/**'
              - '.github/workflows/pr-check.yml'

  node:
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            pi-bridge/package-lock.json
            packages/extension-api/package-lock.json

      - name: Check Pi Bridge types
        working-directory: pi-bridge
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          npm run check

      - name: Test Pi Bridge
        working-directory: pi-bridge
        run: npm test

      - name: Check Extension API
        working-directory: packages/extension-api
        run: |
          npm ci --ignore-scripts
          npm run check

  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: pi-bridge/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test shared and Android code
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Aether-pr-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          archive: false
